<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Properties and Methods</title>
    <script src="script2.js" defer></script>
</head>

<body>
    <input type="text" id="myInput" placeholder="Enter text here" tabindex="1">
    <br>
    <input type="checkbox" id="myCheckbox" checked>
    <div id="myDiv" data-progress="pending" data-value="10%">
        <p>Progress: <span id="progress">pending</span></p>
        <p>Value: <span id="value">10%</span></p>
    </div>
    <button id="btnSend">Send</button>
    <br>
    <a href="https://example.com" id="exampleLink">Example Link</a>
    <br>
</body>

</html>
