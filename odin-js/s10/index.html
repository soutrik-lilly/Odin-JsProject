<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css Manipulation using JavaScript</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>
    <h1>Css Manipulation using JavaScript</h1>
    <div id="exampleDiv" class="example-class">
        <h2>This is an example heading</h2>
        <p>This is an example paragraph inside the div.</p>
        <br>
        <a id="exampleLink" href="https://www.example.com">Example Link</a>
        <br>
        <form id="exampleForm">
            <label for="exampleInput">Example Input:</label>
            <input type="text" id="exampleInput" name="exampleInput">
            <button type="submit">Submit</button>
        </form>
    </div>
</body>

</html>
